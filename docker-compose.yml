services:

  photos:
    build:
      context: ./apps/photos
      dockerfile: Dockerfile
    container_name: photos
    ports:
      - "3002:3000"
      - "50052:50052"
    env_file:
      - .env
    environment:
      # Variables específicas para photos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME}
      GRPC_PORT: 50052
      UPLOAD_PATH: /app/uploads
    volumes:
      - ./apps/photos:/app
      - /app/node_modules
      - ./contracts:/app/contracts
      - photos_uploads:/app/uploads
    working_dir: /app
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  users:
    build:
      context: ./apps/users
      dockerfile: Dockerfile
    container_name: users
    ports:
      - "3001:3000"
      - "50051:50051"
    env_file:
      - .env
    volumes:
      - ./apps/users:/app
      - /app/node_modules
      - ./contracts:/app/contracts
    working_dir: /app
    command: npm run start:dev

  documents:
    build:
      context: ./apps/documents
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/documents:/app
      - temp_files:/tmp/uploads
      - insightface_models:/root/.insightface/models 
    working_dir: /app

  commerce:
    build:
      context: ./apps/commerce
      dockerfile: Dockerfile
    container_name: commerce
    ports:
      - "3003:3000"
    env_file:
      - .env
    volumes:
      - ./apps/commerce:/app
      - /app/node_modules
      - ./contracts:/app/contracts
    working_dir: /app
    command: npm run start:dev

  logistics:
    build:
      context: ./go/logistics
      dockerfile: Dockerfile
    container_name: logistics
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ORDER_PAID: order.paid
      KAFKA_GROUP_ID: logistics-group
      DATABASE_URL: host=postgres-logistics user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} port=5432 sslmode=disable
    depends_on:
      postgres-logistics:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  postgres-logistics:
    image: postgis/postgis:16-3.4
    container_name: postgres-logistics
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_logistics_data:/var/lib/postgresql/data
      - ./docker/postgres-logistics/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_NAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s


  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'single-broker-cluster'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  postgres_logistics_data:
  redis_data:
  kafka_data:
  mongo_data:
  temp_files:
  insightface_models:
  contracts:
  photos_uploads:
